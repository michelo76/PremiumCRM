<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<title>Now Playing</title>
<!--
  Now Playing Info – Control4 driver web UI.
  Single self-contained file: no sub-resources (no external CSS/JS/fonts/url()), so it loads from
  controller://driver/now_playing_info/index.html locally and remotely. Only remote artwork is fetched.
  Data: Control4 Navigator JS API (window.C4) when present, else HTTP polling of "api/state".
-->
<style>
:root{
  --bg:#0b0b0d;--bg-rgb:11,11,13;
  --fg:#f3efe6;--fg2:rgba(243,239,230,.76);--fg3:rgba(243,239,230,.54);--fg4:rgba(243,239,230,.36);
  --line:rgba(243,239,230,.12);
  --ah:36;--as:68%;--al:64%;
  --accent:hsl(var(--ah),var(--as),var(--al));
  --serif:"Noto Serif","Droid Serif",Georgia,Cambria,Caladea,"Bitstream Charter",serif;
  --sans:Roboto,"Segoe UI","Helvetica Neue","Liberation Sans",Arial,sans-serif;
  --pad:3.5rem;
}
html{font-size:16px;background:#0b0b0d;height:100%}
@media (min-width:1500px) and (min-height:900px){html{font-size:20px}}
@media (min-width:1880px) and (min-height:1040px){html{font-size:21px}}
@media (max-width:1023px){:root{--pad:2.25rem}}
@media (max-width:640px){html{font-size:15px}:root{--pad:1.1rem}}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:#0b0b0d;color:var(--fg);font-family:var(--sans);line-height:1.4;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-touch-callout:none;overflow-x:hidden}
img{-webkit-user-drag:none}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:0 0 auto}

/* ---------- background ---------- */
.bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;background:#0b0b0d}
.bg-layer{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 1.1s ease}
.bg-layer.is-on{opacity:1}
.bg-layer img,.bg-layer canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.bg-gen,.bg-photo,.bg-soft{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.bg-photo img{opacity:.6}
.bg-soft canvas{opacity:.8;transform:scale(1.12)}
.bg-gen{background:
  radial-gradient(ellipse 65% 70% at 85% 10%,hsla(var(--ah),42%,34%,.7),hsla(var(--ah),42%,34%,0) 72%),
  radial-gradient(ellipse 45% 40% at 55% 0%,hsla(var(--ah),30%,50%,.22),hsla(var(--ah),30%,50%,0) 70%),
  radial-gradient(ellipse 60% 55% at 8% 96%,hsla(var(--ah),34%,22%,.6),hsla(var(--ah),34%,22%,0) 70%),
  linear-gradient(160deg,#16161a,#0b0b0d 60%)}
.bg-scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:
  linear-gradient(90deg,rgba(11,11,13,.95) 0%,rgba(11,11,13,.84) 30%,rgba(11,11,13,.4) 62%,rgba(11,11,13,.22) 100%),
  linear-gradient(0deg,rgba(11,11,13,.98) 0%,rgba(11,11,13,.55) 26%,rgba(11,11,13,0) 52%),
  linear-gradient(180deg,rgba(11,11,13,.55) 0%,rgba(11,11,13,0) 16%)}
.bg-glow{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 55% 45% at 12% 100%,hsla(var(--ah),60%,42%,.16),hsla(var(--ah),60%,42%,0) 70%)}
@media (orientation:portrait){
  .bg-layer{height:68%}
  .bg-scrim{background:linear-gradient(180deg,rgba(11,11,13,.5) 0%,rgba(11,11,13,.12) 16%,rgba(11,11,13,.45) 38%,rgba(11,11,13,.94) 60%,#0b0b0d 68%)}
}
.mode-idle .bg-scrim{background:linear-gradient(90deg,rgba(11,11,13,.5),rgba(11,11,13,0) 70%)}

/* ---------- connection indicator ---------- */
.conn{position:fixed;top:.85rem;right:.85rem;z-index:30;display:flex;align-items:center;padding:.4rem .85rem .4rem .7rem;border-radius:2rem;
  background:rgba(22,22,25,.92);border:1px solid var(--line);font-size:.78rem;letter-spacing:.05em;color:var(--fg2);
  opacity:0;-webkit-transform:translateY(-.6rem);transform:translateY(-.6rem);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.conn.is-on{opacity:1;-webkit-transform:none;transform:none}
.conn-dot{width:.5rem;height:.5rem;border-radius:50%;background:#e8a33d;margin-right:.55rem;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- modes ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.np{display:none}
.mode-np .np{display:flex;flex-direction:column;min-height:100vh;animation:fadein .6s ease both}
.sections{flex:1 0 auto}
.mode-np .idle{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- idle ---------- */
.idle{min-height:100vh;display:flex;align-items:center;padding:3rem var(--pad)}
.idle-inner{max-width:46rem;animation:fadein .8s ease both}
.idle-time{font-size:8.5rem;font-weight:300;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums;color:var(--fg)}
.idle-ampm{font-size:1.9rem;font-weight:400;letter-spacing:.12em;margin-left:.9rem;color:var(--fg3)}
.idle-date{font-size:1.05rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);margin-top:1.4rem}
.idle-rule{width:2.75rem;height:2px;background:var(--accent);margin:2.6rem 0 1.7rem}
.idle-title{font-family:var(--serif);font-size:2.15rem;font-weight:600;line-height:1.15}
.idle-sub{color:var(--fg3);margin-top:.6rem;font-size:1.05rem}
@media (max-width:640px){.idle-time{font-size:5.4rem}.idle-ampm{font-size:1.3rem;margin-left:.5rem}.idle-title{font-size:1.7rem}}

/* ---------- top bar (no tap handlers here: Navigator uses header taps) ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1.35rem var(--pad) 0;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.topbar-room{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:1.5rem}
.topbar-clock{letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:400}

/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column;justify-content:flex-end;min-height:calc(100vh - 3.4rem);padding:2rem var(--pad) 2.6rem}
.no-photo .hero{justify-content:center}
.hero-inner{display:flex;align-items:flex-end}
.art{flex:0 0 auto;width:17.5rem;margin-right:3rem;position:relative}
.art:before{content:"";display:block;padding-top:150%}
.art.is-square{width:21rem}.art.is-square:before{padding-top:100%}
.art.is-wide{width:25rem}.art.is-wide:before{padding-top:56.25%}
.art-stack{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:.4rem;overflow:hidden;background:#18181b;
  box-shadow:0 1.75rem 3.5rem -.75rem rgba(0,0,0,.8),0 .25rem 1rem rgba(0,0,0,.45)}
.art-stack:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);pointer-events:none;z-index:5}
.art-layer{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .7s ease}
.art-layer.is-on{opacity:1}
.art-layer img{width:100%;height:100%;object-fit:cover;display:block}

/* generated artwork */
.gen{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:1.4rem 1.4rem 1.5rem;color:rgba(255,255,255,.92)}
.gen-mark{position:absolute;right:-.06em;bottom:-.24em;font-family:var(--serif);font-weight:700;font-size:15rem;line-height:1;color:rgba(255,255,255,.06)}
.gen-top{display:flex;align-items:center;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:700;position:relative}
.gen-top svg{width:1.15rem;height:1.15rem;margin-right:.55rem}
.gen-body{position:relative}
.gen-rule{width:2rem;height:2px;background:rgba(255,255,255,.55);margin-bottom:.9rem}
.gen-title{font-family:var(--serif);font-weight:700;font-size:1.65rem;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;word-wrap:break-word}
.gen-sub{font-size:.82rem;color:rgba(255,255,255,.6);margin-top:.5rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-wide .gen{padding:1.1rem 1.25rem}.is-wide .gen-title{font-size:1.35rem;-webkit-line-clamp:3}.is-wide .gen-mark{font-size:10rem}

/* info column */
.info{flex:1 1 auto;min-width:0;max-width:50rem;padding-bottom:.1rem}
.info-body{transition:opacity .28s ease}
.eyebrow{display:flex;align-items:center;flex-wrap:nowrap;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg2);margin-bottom:1.1rem;font-weight:700}
.eyebrow-state{color:var(--accent);margin-right:.75rem;white-space:nowrap}
.eyebrow-source{display:flex;flex-wrap:nowrap;align-items:center;min-width:0;overflow:hidden;font-weight:400;letter-spacing:.14em}
.eyebrow-source span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.eyebrow-source span+i+span{flex-shrink:0;max-width:60%}
.eyebrow-source .sep{width:.22rem;height:.22rem;border-radius:50%;background:var(--fg4);margin:0 .65rem;flex:0 0 auto}
.app-icon{width:1.25rem;height:1.25rem;border-radius:.25rem;margin-right:.55rem;object-fit:cover}

/* state indicator */
.ind{display:inline-flex;align-items:flex-end;justify-content:space-between;width:.95rem;height:.8rem;margin-right:.65rem;flex:0 0 auto}
.ind i{display:block;width:.19rem;height:100%;background:var(--accent);border-radius:1px;-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.ind[data-state=playing] i{animation:eq 1.1s ease-in-out infinite alternate}
.ind[data-state=playing] i:nth-child(1){animation-duration:.9s}
.ind[data-state=playing] i:nth-child(2){animation-duration:1.25s;animation-delay:-.4s}
.ind[data-state=playing] i:nth-child(3){animation-duration:1s;animation-delay:-.7s}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.ind[data-state=paused]{width:.7rem;justify-content:space-between}
.ind[data-state=paused] i{width:.22rem;background:var(--fg)}
.ind[data-state=paused] i:nth-child(3){display:none}
.ind[data-state=buffering]{align-items:center}
.ind[data-state=buffering] i{height:.19rem;border-radius:50%;animation:pulse 1s ease-in-out infinite}
.ind[data-state=buffering] i:nth-child(2){animation-delay:.2s}.ind[data-state=buffering] i:nth-child(3){animation-delay:.4s}
.ind[data-state=stopped],.ind[data-state=idle],.ind[data-state=off]{width:.62rem;height:.62rem;align-items:center}
.ind[data-state=stopped] i,.ind[data-state=idle] i,.ind[data-state=off] i{width:.62rem;height:.62rem;background:var(--fg3);border-radius:1px}
.ind[data-state=stopped] i+i,.ind[data-state=idle] i+i,.ind[data-state=off] i+i{display:none}

.kicker{display:flex;align-items:center;flex-wrap:wrap;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-bottom:.7rem;font-weight:700}
.chan-num{border:1px solid var(--fg4);border-radius:.25rem;padding:.1rem .45rem;margin-right:.65rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.title{font-family:var(--serif);font-weight:700;font-size:3.6rem;line-height:1.05;letter-spacing:-.012em;margin:0;color:var(--fg);
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;word-wrap:break-word;padding-bottom:.04em}
.title.is-long{font-size:2.85rem}
.title.is-xlong{font-size:2.2rem;-webkit-line-clamp:4}
.logo{display:none;max-width:24rem;max-height:7rem;margin:.2rem 0 .3rem}
.has-logo .logo{display:block}
.has-logo .title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.subline{font-size:1.35rem;color:var(--fg2);margin-top:.65rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ep-code{color:var(--accent);font-weight:700;letter-spacing:.05em;margin-right:.55rem;white-space:nowrap}
.artist{font-size:1.75rem;color:var(--accent);font-weight:600;margin-top:.55rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album{font-size:1.08rem;color:var(--fg2);margin-top:.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album em{font-style:italic;font-family:var(--serif);color:var(--fg)}

/* separators sit before each item; the container is shifted left and clipped so a wrapped line never starts with a dot */
.meta{display:flex;flex-wrap:wrap;align-items:center;font-size:.98rem;color:var(--fg2);margin-left:-1.4rem}
.meta-wrap{overflow:hidden;margin-top:1.15rem}
.meta>span{position:relative;display:inline-flex;align-items:center;padding-left:1.4rem;margin-bottom:.3rem;white-space:nowrap;max-width:100%}
.meta>span:before{content:"";position:absolute;left:.58rem;top:50%;margin-top:-.12rem;width:.24rem;height:.24rem;border-radius:50%;background:var(--fg4)}
.badge{border:1px solid rgba(243,239,230,.5);border-radius:.22rem;padding:.04rem .38rem;font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--fg)}

.ratings{display:flex;flex-wrap:wrap;margin-top:1rem}
.chip{display:inline-flex;align-items:center;height:2.3rem;padding:0 .8rem 0 .42rem;margin:0 .55rem .55rem 0;border-radius:.45rem;
  background:rgba(243,239,230,.075);border:1px solid rgba(243,239,230,.1);font-size:1rem;font-weight:700;white-space:nowrap;color:var(--fg)}
.chip .lbl{display:inline-block;border-radius:.2rem;margin-right:.5rem;font-weight:800;line-height:1}
.chip-imdb .lbl{background:#f5c518;color:#000;font-size:.74rem;padding:.25rem .32rem;letter-spacing:-.01em;font-family:Arial,var(--sans)}
.chip-tmdb .lbl{color:#0b0b0d;background:#7fd1b9;font-size:.66rem;padding:.27rem .32rem;letter-spacing:.06em}
.chip svg{width:1.35rem;height:1.35rem;margin-right:.42rem}
.chip .mc{display:inline-block;min-width:1.65rem;height:1.65rem;line-height:1.65rem;text-align:center;border-radius:.22rem;font-weight:800;margin-right:.5rem;font-size:.86rem;padding:0 .15rem}
.chip-mc .cap{margin-left:0}
.chip .dim{color:var(--fg3);font-weight:400;margin-left:.2rem;font-size:.82rem}
.chip .cap{color:var(--fg3);font-weight:400;margin-left:.4rem;font-size:.8rem;letter-spacing:.02em}

.tagline{max-width:44rem;font-family:var(--serif);font-style:italic;font-size:1.18rem;color:var(--fg);opacity:.92;margin-top:1.15rem;line-height:1.35}
.clamp{position:relative}
.clamp-text{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.clamp.is-open .clamp-text{display:block;-webkit-line-clamp:none;overflow:visible}
.clamp-more{display:none;margin-top:.15rem;padding:.45rem 0 .2rem;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--fg)}
.clamp.is-clamped .clamp-more,.clamp.is-open .clamp-more{display:inline-block}
.clamp.is-clamped,.clamp.is-open{cursor:pointer}
.overview{font-size:1.03rem;line-height:1.58;color:var(--fg2);margin-top:.75rem;max-width:44rem}
.tagline+.overview{margin-top:.45rem}
.meta-wrap+.overview,.ratings+.overview{margin-top:1rem}

/* progress */
.progress{margin-top:1.7rem;max-width:44rem}
.progress.is-hidden{display:none}
.progress-bar{height:.3rem;border-radius:.3rem;background:rgba(243,239,230,.17);overflow:hidden;position:relative}
.progress-fill{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--accent);-webkit-transform-origin:0 50%;transform-origin:0 50%;-webkit-transform:scaleX(0);transform:scaleX(0);transition:transform .5s linear}
.no-bar .progress-bar{display:none}
.is-paused .progress-fill{opacity:.55}
.progress-labels{display:flex;justify-content:space-between;align-items:center;margin-top:.65rem;font-size:.86rem;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-left,.progress-right{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.progress-right{margin-left:1rem}
.live-pill{display:none;text-transform:uppercase;background:#e5322d;color:#fff;font-weight:800;font-size:.68rem;letter-spacing:.14em;padding:.2rem .45rem .18rem .5rem;border-radius:.2rem;margin-right:.7rem}
.is-live .live-pill{display:inline-block}
.no-bar .progress-labels{margin-top:0}

/* ---------- sections ---------- */
.sections{padding:.5rem var(--pad) 0;background:linear-gradient(180deg,rgba(11,11,13,0) 0,rgba(11,11,13,.9) 3rem,rgba(11,11,13,.97) 100%);transition:opacity .28s ease}
.sec{padding-top:1.6rem;margin-top:2rem;border-top:1px solid var(--line)}
.sections>.sec:first-child,.sections>.cols:first-child{margin-top:0}
.sec-h{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin:0 0 1.3rem}
.cols{display:-ms-grid;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-column-gap:3.5rem;margin-top:2rem}
.cols>.sec{margin-top:0}
.is-switching .info-body,.is-switching .sections{opacity:0}

/* cast */
.crew{display:flex;flex-wrap:wrap;margin-bottom:1.5rem}
.crew-item{margin:0 2.5rem .6rem 0;max-width:100%}
.crew-k{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin-bottom:.3rem}
.crew-v{font-size:1rem;color:var(--fg)}
.rail{display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:0 0 .4rem var(--pad);scroll-padding:0 var(--pad);overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail:after{content:"";flex:0 0 calc(var(--pad) - 1.25rem)}
.person{flex:0 0 7.4rem;width:7.4rem;margin-right:1.25rem;scroll-snap-align:start;text-align:center}
.avatar{position:relative;width:6.2rem;height:6.2rem;border-radius:50%;margin:0 auto .75rem;overflow:hidden;background:#222;box-shadow:0 .6rem 1.4rem -.5rem rgba(0,0,0,.8)}
.avatar img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
.avatar img.is-loaded{opacity:1}
.initials{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--serif);font-size:1.75rem;font-weight:600;color:rgba(255,255,255,.82);letter-spacing:.02em}
.person-name{font-size:.92rem;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-wrap:break-word}
.person-role{font-size:.8rem;color:var(--fg3);line-height:1.3;margin-top:.25rem;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-wrap:break-word}

/* episode card */
.epcard{display:flex;align-items:flex-start}
.epcard-still{flex:0 0 22rem;width:22rem;margin-right:2.2rem;position:relative;border-radius:.4rem;overflow:hidden;background:#1a1a1d;box-shadow:0 1rem 2rem -.8rem rgba(0,0,0,.8)}
.epcard-still:before{content:"";display:block;padding-top:56.25%}
.epcard-still img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.epcard-still img.is-loaded{opacity:1}
.epcard-body{flex:1 1 auto;min-width:0;max-width:44rem}
.epcard-code{color:var(--accent);font-weight:700;letter-spacing:.16em;font-size:.78rem;text-transform:uppercase}
.epcard-title{font-family:var(--serif);font-size:1.75rem;font-weight:700;line-height:1.15;margin:.4rem 0 0}
.epcard .meta-wrap{margin-top:.7rem}.epcard .meta{font-size:.9rem}
.epcard .overview{margin-top:.8rem}
.star{color:#f5c518;margin-right:.3rem;font-size:.95rem}
.strip{display:flex;flex-wrap:wrap;margin-top:1.6rem}
.stat{margin:0 2.4rem .8rem 0}
.stat-v{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.1}
.stat-k{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin-top:.3rem}
.stat-next .stat-v{color:var(--accent)}

/* tracks */
.album-head{font-size:.95rem;color:var(--fg2);margin:-.6rem 0 1rem}
.tracks{list-style:none;margin:0;padding:0}
.track{display:flex;align-items:center;min-height:2.85rem;padding:0 .9rem;border-radius:.4rem;font-size:1rem;border-top:1px solid rgba(243,239,230,.07)}
.track:first-child{border-top-color:transparent}
.track-n{flex:0 0 2.1rem;color:var(--fg3);font-variant-numeric:tabular-nums;font-size:.9rem;display:flex;align-items:center}
.track-t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.track-d{color:var(--fg3);margin-left:1rem;font-variant-numeric:tabular-nums;font-size:.9rem}
.track.is-current{background:hsla(var(--ah),55%,50%,.14);border-top-color:transparent}
.track.is-current+.track{border-top-color:transparent}
.track.is-current .track-t{color:var(--fg);font-weight:600}
.track.is-current .track-d{color:var(--accent)}
.track .ind{margin-right:0}
.artist-photo{position:relative;border-radius:.4rem;overflow:hidden;background:#1a1a1d;margin-bottom:1.2rem;display:none}
.artist-photo.is-loaded{display:block}
.artist-photo:before{content:"";display:block;padding-top:56.25%}
.artist-photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.bio{font-size:1rem;line-height:1.62;color:var(--fg2)}
.bio .clamp-text{-webkit-line-clamp:7}

/* up next */
.sched{display:flex;flex-wrap:wrap}
.slot{flex:1 1 18rem;min-width:0;margin:0 3rem 1rem 0;padding-left:1.1rem;border-left:2px solid var(--line)}
.slot.is-now{border-left-color:var(--accent)}
.slot-k{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.slot.is-now .slot-k{color:var(--accent)}
.slot-t{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.2;margin-top:.35rem;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.slot-s{color:var(--fg3);margin-top:.3rem;font-size:.92rem;font-variant-numeric:tabular-nums}

/* facts */
.facts{display:-ms-grid;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));grid-gap:1.5rem 2.5rem}
.fact-k{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);font-weight:700;margin-bottom:.35rem;word-wrap:break-word}
.fact-v{font-size:1rem;color:var(--fg);line-height:1.42;word-wrap:break-word;overflow-wrap:break-word}

/* footer */
.sections:empty{background:none;padding:0}
.sections:empty+.foot{background:none}
.foot{padding:2.75rem var(--pad) 2rem;font-size:.72rem;line-height:1.6;color:var(--fg4);background:rgba(11,11,13,.97);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.foot-attr{margin-right:2rem;min-width:0}
.foot-brand{letter-spacing:.18em;text-transform:uppercase;font-weight:700;white-space:nowrap}

/* ---------- kiosk: single-screen glance ---------- */
.kiosk .sections{display:none}
.kiosk .hero{padding-bottom:3.4rem}
.kiosk .foot{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 var(--pad) .9rem;background:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kiosk .foot-brand{display:none}
.kiosk .foot-attr div{display:inline}
.kiosk .foot-attr div+div:before{content:" \2014  "}

/* ---------- tablet portrait / narrow ---------- */
@media (orientation:portrait) and (min-width:641px){
  .hero-inner{align-items:center}
  .hero{min-height:56vh;padding-top:3rem}
  .art{width:14rem;margin-right:2.25rem}.art.is-square{width:16rem}.art.is-wide{width:20rem}
  .title{font-size:2.9rem}.title.is-long{font-size:2.4rem}.title.is-xlong{font-size:1.95rem}
  .epcard-still{flex-basis:16rem;width:16rem;margin-right:1.6rem}
  .cols{display:block}.cols>.sec+.sec{margin-top:2rem}
  .kiosk .hero{min-height:calc(100vh - 3.4rem)}
}
@media (orientation:landscape) and (max-width:1023px){
  .art{width:14rem;margin-right:2.25rem}.art.is-square{width:16rem}.art.is-wide{width:19rem}
  .title{font-size:2.8rem}.title.is-long{font-size:2.3rem}.title.is-xlong{font-size:1.9rem}
}
@media (orientation:landscape) and (max-height:620px){
  .hero{min-height:0}
  .art{width:12rem}.art.is-square{width:14rem}.art.is-wide{width:17rem}
}

/* ---------- phone ---------- */
@media (max-width:640px){
  .topbar{padding-top:1rem;font-size:.7rem}
  .hero{min-height:0;padding:1.5rem var(--pad) 2rem}
  .hero-inner{display:block}
  .art{width:62%;margin:0 auto 1.9rem}.art.is-square{width:82%}.art.is-wide{width:100%}
  .eyebrow{font-size:.72rem;margin-bottom:.9rem;flex-wrap:wrap}
  .eyebrow-source{flex:1 1 100%;margin-top:.35rem}
  .title{font-size:2.35rem}.title.is-long{font-size:2rem}.title.is-xlong{font-size:1.65rem;-webkit-line-clamp:5}
  .subline{font-size:1.15rem}
  .artist{font-size:1.45rem;white-space:normal}
  .meta{font-size:.92rem}
  .overview .clamp-text{-webkit-line-clamp:4}
  .gen-mark{font-size:12rem}
  .epcard{display:block}
  .epcard-still{width:100%;margin:0 0 1.2rem}
  .cols{display:block}.cols>.sec+.sec{margin-top:2rem}
  .person{flex-basis:6.4rem;width:6.4rem;margin-right:1rem}
  .avatar{width:5.4rem;height:5.4rem}
  .rail:after{flex-basis:calc(var(--pad) - 1rem)}
  .facts{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));grid-gap:1.25rem 1.5rem}
  .foot{display:block}.foot-brand{margin-top:.8rem}
  .slot{flex-basis:100%;margin-right:0}
  .stat{margin-right:1.8rem}
  .kiosk .foot{white-space:normal}
}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none !important;transition:none !important}
  .ind[data-state=playing] i:nth-child(1){transform:scaleY(.55)}
  .ind[data-state=playing] i:nth-child(3){transform:scaleY(.75)}
}

    if (!M.d || KIOSK) return;
    var parts = [];
    if (M.kind === 'episode') parts.push(episodeSection(M));
    if (M.kind === 'music') parts = parts.concat(musicSections(M));
    if (M.kind === 'live_tv') parts.push(liveSection(M));
    parts.push(castSection(M));
    parts.push(factsSection(M));
    parts.forEach(function (p) { if (p) box.appendChild(p); });
  }

  function buildFooter(M) {
    var f = clear($('foot')), attr = strs(M.dd.attribution);
    var a = el('div', 'foot-attr');
    if (attr.length) {
      a.appendChild(el('div', '', 'Metadata: ' + attr.join(' · ')));
      if (attr.some(function (x) { return /^tmdb$|themoviedb/i.test(x); })) {
        a.appendChild(el('div', '', 'This product uses the TMDB API but is not endorsed or certified by TMDB.'));
      }
    }
    add(f, a, KIOSK ? null : el('div', 'foot-brand', 'Now Playing Info'));
  }

  function buildStatic(M) {
    curModel = M;
    buildHero(M);
    buildSections(M);
    buildFooter(M);
    ROOT.setAttribute('data-kind', M.kind);
    requestAnimationFrame(checkClamps);
  }

  // ------------------------------------------------------------------ dynamic (every update)
  function updateDynamic(M) {
    setText($('room'), M.room);
    var ind = $('ind'); if (ind.getAttribute('data-state') !== M.state) ind.setAttribute('data-state', M.state);
    var ti = $('track-ind'); if (ti && ti.getAttribute('data-state') !== M.state) ti.setAttribute('data-state', M.state);
    setText($('eyebrow-state'), STATE_LABEL[M.state] || M.state);
    var srcKey = M.device + '\u0001' + M.app + '\u0001' + M.appIcon, es = $('eyebrow-source');
    if (es.getAttribute('data-k') !== srcKey) {
      es.setAttribute('data-k', srcKey); clear(es);
      if (M.appIcon) {
        var ic = new Image(); ic.className = 'app-icon'; ic.alt = '';
        ic.onerror = function () { if (ic.parentNode) ic.parentNode.removeChild(ic); };
        ic.src = M.appIcon; es.appendChild(ic);
      }
      [M.device, M.app].filter(Boolean).forEach(function (t, i) {
        if (i) es.appendChild(el('i', 'sep'));
        es.appendChild(el('span', '', t));
      });
    }
    var pb = M.pb, lv = obj(M.dd.live);
    prog = {
      state: M.state, pos: num(pb.position_s), dur: num(pb.duration_s), at: num(pb.position_updated_at),
      live: pb.is_live === true || M.kind === 'live_tv', ps: num(lv.program_start), pe: num(lv.program_end)
    };
    var p = $('progress');
    p.classList.toggle('is-paused', M.state === 'paused' || M.state === 'buffering');
    tick();
  }

  var lastLabels = '';
  function tick() {
    if (mode !== 'np' || !prog) return;
    var p = $('progress'), P = prog, frac = null, left = '', right = '', hidden = false;
    var now = nowS() - skew;
    if (P.live) {
      if (P.ps && P.pe && P.pe > P.ps) {
        frac = clamp((now - P.ps) / (P.pe - P.ps), 0, 1);
        left = fmtEpochClock(P.ps) + ' – ' + fmtEpochClock(P.pe);
        var rem = Math.max(0, P.pe - now); right = fmtRuntime(Math.ceil(rem / 60) || 1) + ' left';
      }
    } else if (P.pos != null || P.dur) {
      var pos = P.pos || 0;
      if (P.state === 'playing' && P.at != null) pos += clamp(now - P.at, 0, 86400);
      if (P.dur) pos = clamp(pos, 0, P.dur);
      left = fmtDur(pos);
      if (P.dur && P.dur > 0) {
        frac = pos / P.dur;
        var r = P.dur - pos;
        right = '−' + fmtDur(r);
        if (P.state === 'playing' && r > 60) right += '  ·  Ends ' + fmtClock(new Date(Date.now() + r * 1000));
      }
    } else hidden = true;
    if (P.live && !left) { hidden = false; }
    p.classList.toggle('is-hidden', hidden);
    p.classList.toggle('is-live', P.live);
    p.classList.toggle('no-bar', frac == null);
    if (frac != null) {
      var tf = 'scaleX(' + frac.toFixed(4) + ')', fill = $('progress-fill');
      if (fill.style.transform !== tf) { fill.style.webkitTransform = tf; fill.style.transform = tf; }
    }
    var lk = left + '|' + right;
    if (lk !== lastLabels) { lastLabels = lk; setText($('progress-left'), left); setText($('progress-right'), right); }
  }

  // ------------------------------------------------------------------ idle / clock
  var idleInfo = null;
  function showIdle(M) {
    setMode('idle');
    artToken++;
    idleInfo = M;
    setAccent(IDLE_ACCENT);
    bgFader.show('gen:idle', genBackdrop());
    var room = M ? M.room : '';
    if (!M) { setText($('idle-title'), 'Connecting'); setText($('idle-sub'), 'Waiting for your Control4 system…'); }
    else {
      setText($('idle-title'), room ? 'Nothing playing in ' + room : 'Nothing playing');
      var who = M.device || (room ? 'The ' + room : 'The system');
      setText($('idle-sub'), M.state === 'off' ? who + (M.device ? ' is off' : ' is off') : M.state === 'stopped' ? 'Playback stopped' : M.device ? M.device + ' is ready' : 'Start something on any source and it will appear here.');
    }
    clockTick(true);
  }
  var lastClock = '';
  function clockTick(force) {
    var d = new Date(), t = fmtClock(d);
    if (t === lastClock && !force) return;
    lastClock = t;
    setText($('clock'), t);
    var m = /^(.*?)\s*([AaPp]\.?\s?[Mm]\.?)$/.exec(t), te = clear($('idle-time'));
    if (m) add(te, D.createTextNode(m[1]), el('span', 'idle-ampm', m[2]));
    else te.textContent = t;
    var ds; try { ds = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); } catch (e) { ds = d.toDateString(); }
    setText($('idle-date'), ds);
  }

  // ------------------------------------------------------------------ render
  function render(st) {
    var M = buildModel(st);
    bodyCls.remove('is-booting');
    if (M.idle) { curModel = null; return showIdle(M); }
    var first = mode !== 'np';
    setMode('np');
    if (M.key !== curKey) {
      curKey = M.key; curSig = M.sig;
      startArtwork(M);
      clearTimeout(switchTimer);
      if (first || !curModel) { buildStatic(M); }
      else {
        $('np').classList.add('is-switching');
        switchTimer = setTimeout(function () { buildStatic(curModelPending || M); curModelPending = null; $('np').classList.remove('is-switching'); }, 300);
        curModelPending = M;
      }
    } else if (M.sig !== curSig) {
      curSig = M.sig;
      if (curModelPending) curModelPending = M; else buildStatic(M);
    } else if (curModelPending) curModelPending = M;
    updateDynamic(M);
  }
  var curModelPending = null;

  // ------------------------------------------------------------------ ingest (shared by both transports)
  function ingest(st, via, dateSkew) {
    if (!isObj(st) || !isObj(st.playback)) return;
    var v = st.version;
    var same = cur && v != null && v === cur.version && st.media_key === cur.media_key;
    if (same) return;
    // Clock skew between this device and the controller (seconds). Prefer an explicit send time,
    // then the HTTP Date header; else derive from updated_at once per version.
    var local = nowS(), sent = num(st.sent_at) || num(st.server_time) || num(st.now);
    var ns = null;
    if (sent) ns = local - sent;
    else if (dateSkew != null) ns = dateSkew;
    else if (num(st.updated_at)) {
      var cand = local - num(st.updated_at);
      // A live version change carries a fresh updated_at; a first/stale snapshot only tells us an upper bound.
      ns = cur ? cand : Math.min(cand, 0);
    }
    if (ns != null && Math.abs(ns) < 86400 * 2) skew = Math.abs(ns) < 1.5 ? 0 : ns;
    cur = st;
    try { render(st); } catch (e) { if (W.console) console.error('render failed', e); }
  }

  // ------------------------------------------------------------------ connection indicator
  var connShown = false;
  function setConn(bad) {
    if (bad === connShown) return; connShown = bad;
    $('conn').classList.toggle('is-on', bad);
  }

  // ------------------------------------------------------------------ transport (a): Control4 Navigator
  function extractState(x, depth) {
    depth = depth || 0;
    if (depth > 6 || x == null) return null;
    if (typeof x === 'string') {
      var s = x.trim();
      if (s.charAt(0) !== '{' && s.charAt(0) !== '[' && s.charAt(0) !== '"') return null;
      try { return extractState(JSON.parse(s), depth + 1); } catch (e) { return null; }
    }
    if (typeof x !== 'object') return null;
    if (!Array.isArray(x) && (x.schema === 1 || x.schema === '1') && isObj(x.playback)) return x;
    var keys = Object.keys(x);
    // Prefer well-known wrapper keys first, then everything else.
    keys.sort(function (a, b) { return pri(a) - pri(b); });
    for (var i = 0; i < keys.length; i++) {
      var r = extractState(x[keys[i]], depth + 1); if (r) return r;
    }
    return null;
  }
  function pri(k) { return /^(STATE_JSON|state|value|data|NOW_PLAYING|payload)$/i.test(k) ? 0 : 1; }

  var c4 = { active: false, wd: null, miss: 0, seen: false };
  function c4Receive(x) {
    var st = extractState(x, 0);
    if (!st) return;
    c4.seen = true; c4.miss = 0; clearTimeout(c4.wd); c4.wd = null;
    setConn(false);
    ingest(st, 'c4');
  }
  function c4Request() {
    clearTimeout(c4.wd);
    try { W.C4.sendCommand('GET_STATE', '{}', true, false); } catch (e) { /* host may throw if not ready */ }
    var wait = Math.min(5000 * Math.pow(2, c4.miss), 30000);
    c4.wd = setTimeout(function () {
      c4.miss++;
      setConn(true);
      if (!cur) showIdle(null);
      c4Request();
    }, wait);
  }
  // Global callbacks required by the Navigator JS API. Defined unconditionally (harmless otherwise).
  W.onDataToUi = function (x) { c4Receive(x); };
  W.onVariable = function (x) { c4Receive(x); };
  W.onSendCommandError = function (msg) {
    if (W.console) console.warn('C4 sendCommand error', msg);
    if (c4.active) { setConn(true); }
  };
  W.onSubscribeToVariableError = function (name, msg) { if (W.console) console.warn('C4 subscribe error', name, msg); };

  function startC4() {
    c4.active = true;
    try { W.C4.subscribeToVariable('STATE_JSON', false); } catch (e) { /* ignore */ }
    try { W.C4.subscribeToDataToUi(false); } catch (e) { /* ignore */ }
    c4Request();
    D.addEventListener('visibilitychange', function () { if (!D.hidden) c4Request(); });
  }

  // ------------------------------------------------------------------ transport (b): HTTP polling
  var http = { etag: null, fails: 0, timer: null, inflight: false };
  var API = Q.api || ('api/state' + (Q.fixture ? '?fixture=' + encodeURIComponent(Q.fixture) : ''));
  function httpSchedule(ms) { clearTimeout(http.timer); if (!D.hidden) http.timer = setTimeout(httpPoll, ms); }
  function httpPoll() {
    if (D.hidden || http.inflight) return;
    http.inflight = true;
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    var headers = {}; if (http.etag) headers['If-None-Match'] = http.etag;
    var opts = { cache: 'no-store', headers: headers, credentials: 'same-origin' }; if (ctl) opts.signal = ctl.signal;
    fetch(API, opts).then(function (res) {
      var ds = null, dh = res.headers.get('Date');
      if (dh) { var t = Date.parse(dh); if (!isNaN(t)) ds = nowS() - t / 1000 - 0.5; }
      if (res.status === 304) return { ok: true };
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var et = res.headers.get('ETag');
      return res.json().then(function (j) {
        var st = extractState(j, 0) || j;
        if (!isObj(st) || !isObj(st.playback)) throw new Error('bad payload');
        http.etag = et || null;
        ingest(st, 'http', ds);
        return { ok: true };
      });
    }).then(function () {
      http.fails = 0; setConn(false);
    }, function (err) {
      http.fails++;
      if (http.fails >= 2 || !cur) setConn(true);
      if (!cur) showIdle(null);
      if (W.console && http.fails === 1) console.warn('state fetch failed:', err && err.message);
    }).then(function () {
      clearTimeout(to); http.inflight = false;
      httpSchedule(http.fails ? Math.min(2000 * Math.pow(2, http.fails - 1), 10000) : 2000);
    });
  }
  function startHttp() {
    httpPoll();
    D.addEventListener('visibilitychange', function () {
      if (D.hidden) clearTimeout(http.timer); else { clearTimeout(http.timer); httpPoll(); }
    });
  }

  // ------------------------------------------------------------------ boot
  showIdle(null);
  bodyCls.remove('is-booting');
  setInterval(function () { if (!D.hidden) { tick(); clockTick(false); } }, 500);
  var rz; W.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(checkClamps, 200); });

  var started = false;
  function hasC4() { return !!(W.C4 && typeof W.C4.subscribeToDataToUi === 'function'); }
  function start() {
    if (started) return; started = true;
    if (hasC4()) startC4(); else startHttp();
  }
  if (hasC4()) start();
  else if (D.readyState === 'complete') start();
  else W.addEventListener('load', start);
})();
</script>
</body>
</html>
